name: Install and headless tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m platformzero sample --level runway --policy right --episodes 3
      - run: python examples/restore.py
      - run: python -m platformzero benchmark --steps 1000 --workers 2 --warmup 100 --repeats 1
