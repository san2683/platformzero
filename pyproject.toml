[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "platformzero"
version = "0.1.0"
description = "Headless synthetic 2D platformer simulation for reproducible sampling"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "PlatformZero contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/san2683/platformzero"

[project.scripts]
platformzero = "platformzero.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
platformzero = ["maps/*.json"]
